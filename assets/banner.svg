    <!-- Tailwind -->
    <svg x="80" y="0" width="32" height="32" viewBox="0 0 24 24"><path fill="#38BDF8" d="M12 6c-2.7 0-4.4 1.3-5.1 4 1-1.3 2.2-1.8 3.6-1.4.8.2 1.4.8 1.9 1.4.8 1 1.7 2 3.6 2 2.7 0 4.4-1.3 5.1-4-1 1.3-2.2 1.8-3.6 1.4-.8-.2-1.4-.8-1.9-1.4-.8-1-1.7-2-3.6-2zM6.9 12c-2.7 0-4.4 1.3-5.1 4 1-1.3 2.2-1.8 3.6-1.4.8.2 1.4.8 1.9 1.4.8 1 1.7 2 3.6 2 2.7 0 4.4-1.3 5.1-4-1 1.3-2.2 1.8-3.6 1.4-.8-.2-1.4-.8-1.9-1.4-.8-1-1.7-2-3.6-2z"/></svg>
