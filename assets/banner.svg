    <svg x="280" y="0" width="32" height="32" viewBox="0 0 24 24"><path fill="#FFF" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm6.4 16.6L14 11.5V16h-1.8V7.4l1.8.1 4.4 5V7.4h1.8v9.2h-1.8zM8.3 7.4v9.2H6.5V7.4h1.8z"/></svg>
