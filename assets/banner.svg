<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="Nayem Hasan — Full Stack Web Developer">
  <defs>
    <radialGradient id="glowBlue" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0b1220" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="65%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a1326"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="circuit" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 H40 L60 40 H120" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M60 0 V20 L80 40 V120" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="40" cy="60" r="1.6" fill="#38bdf8" fill-opacity="0.35"/>
      <circle cx="60" cy="40" r="1.6" fill="#22d3ee" fill-opacity="0.35"/>
      <circle cx="80" cy="40" r="1.6" fill="#7c3aed" fill-opacity="0.30"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-opacity="0.35" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bgBase)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <rect width="1600" height="500" fill="url(#circuit)"/>

  <!-- Glows -->
  <rect width="1600" height="500" fill="url(#glowBlue)"/>
  <rect width="1600" height="500" fill="url(#glowCyan)"/>
  <rect width="1600" height="500" fill="url(#glowPurple)"/>

  <!-- Abstract Shapes -->
  <g opacity="0.55" filter="url(#softGlow)">
    <circle cx="1380" cy="120" r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="1380" cy="120" r="110" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="1380" cy="120" r="150" fill="none" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="220" cy="400" r="60" fill="none" stroke="#38bdf8" stroke-opacity="0.30" stroke-width="1.2"/>
    <circle cx="220" cy="400" r="95" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Hexagons -->
  <g stroke="#38bdf8" stroke-opacity="0.35" fill="none" stroke-width="1.2">
    <polygon points="150,150 190,127 230,150 230,196 190,219 150,196"/>
    <polygon points="1480,400 1510,383 1540,400 1540,434 1510,451 1480,434"/>
  </g>

  <!-- Divider (Centered) -->
  <rect x="400" y="270" width="800" height="2" fill="url(#lineGrad)"/>

  <!-- Text Content (Centered) -->
  <text x="800" y="200" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" text-anchor="middle"
        font-size="96" font-weight="800" letter-spacing="4" fill="url(#nameGrad)" filter="url(#softGlow)">
    NAYEM HASAN
  </text>

  <text x="800" y="250" font-family="'Fira Code','Consolas',monospace" text-anchor="middle"
        font-size="26" font-weight="500" letter-spacing="8" fill="#22d3ee" fill-opacity="0.95">
    FULL STACK WEB DEVELOPER
  </text>

  <!-- TECH ICONS GROUP (Using Images for perfect rendering) -->
  <g transform="translate(350, 290)">
    
    <!-- 1. React -->
    <g transform="translate(0, 0)">
      <image href="https://skillicons.dev/icons?i=react" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">React</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 2. Next.js -->
    <g transform="translate(100, 0)">
      <image href="https://skillicons.dev/icons?i=nextjs" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Next.js</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 3. Node.js -->
    <g transform="translate(200, 0)">
      <image href="https://skillicons.dev/icons?i=nodejs" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Node.js</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 4. Express.js -->
    <g transform="translate(300, 0)">
      <image href="https://skillicons.dev/icons?i=express" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Express</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 5. MongoDB -->
    <g transform="translate(400, 0)">
      <image href="https://skillicons.dev/icons?i=mongodb" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">MongoDB</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 6. PostgreSQL -->
    <g transform="translate(500, 0)">
      <image href="https://skillicons.dev/icons?i=postgres" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">PostgreSQL</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 7. Prisma -->
    <g transform="translate(600, 0)">
      <image href="https://skillicons.dev/icons?i=prisma" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Prisma</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 8. TypeScript -->
    <g transform="translate(700, 0)">
      <image href="https://skillicons.dev/icons?i=ts" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
      <line x1="100" y1="10" x2="100" y2="90" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- 9. JavaScript -->
    <g transform="translate(800, 0)">
      <image href="https://skillicons.dev/icons?i=js" x="10" y="0" width="48" height="48" />
      <text x="34" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">JavaScript</text>
    </g>

  </g>
</svg>
